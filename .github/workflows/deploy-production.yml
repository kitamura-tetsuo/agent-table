name: Production deployment (manual, protected)

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Reviewed production profile (does not supply operator approval)
        required: true
        type: choice
        default: manual
        options:
          - manual
          - production-relay-events
      expected_sha:
        description: Exact reviewed main commit SHA (40 lowercase hex digits)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  reviewed-deployment:
    uses: ./.github/workflows/_deploy-reviewed.yml
    with:
      target_environment: production
      release_profile: ${{ inputs.release_profile }}
      expected_sha: ${{ inputs.expected_sha }}
    secrets: inherit
