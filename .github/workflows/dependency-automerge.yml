name: Merge validated dependency updates

on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Exact Validation workflow run ID to await
        required: true
        type: string
      expected_sha:
        description: Exact dependency or runtime update head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-table-dependency-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'kitamura-tetsuo/agent-table' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
      statuses: read
    steps:
      # Privileged code always comes from main; candidate files are data only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Merge only the fully validated dependency or runtime head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_VALIDATION_SHA: ${{ inputs.expected_sha }}
        run: node scripts/dependency-automerge.mjs
