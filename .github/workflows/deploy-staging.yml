name: Staging deployment (manual, protected)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit SHA (40 lowercase hex digits)
        required: true
        type: string
      bootstrap_staging:
        description: First-time staging identity bootstrap; disables new guest/table intake and preserves existing DO/KV
        type: boolean
        required: true
        default: false
      expected_active_version_id:
        description: Current deployed staging Worker version UUID, mandatory for first-time bootstrap
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  reviewed-deployment:
    uses: ./.github/workflows/_deploy-reviewed.yml
    with:
      target_environment: staging
      expected_sha: ${{ inputs.expected_sha }}
      bootstrap_staging: ${{ inputs.bootstrap_staging }}
      expected_active_version_id: ${{ inputs.expected_active_version_id }}
    secrets: inherit
