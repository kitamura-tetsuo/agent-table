name: Runtime updates

on:
  schedule:
    # Monday 06:45 JST, after the grouped dependency check.
    - cron: '45 21 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-updates.yml
      - scripts/runtime-updates.mjs
      - scripts/runtime-validation.mjs

permissions:
  contents: read

concurrency:
  group: agent-table-runtime-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'kitamura-tetsuo/agent-table' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Resolve compatible Node, npm, and Docker image updates together
        run: node scripts/runtime-updates.mjs --update
      - name: Validate the proposed runtime pins
        run: node scripts/runtime-updates.mjs --check
      - name: Create or refresh one runtime update PR
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: automation/runtime-updates
          base: main
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore(runtime): update Node, npm, and relay base image"
          title: "chore(runtime): update Node, npm, and relay base image"
          body: |
            Updates the supported Node and npm release lines and the digest-pinned
            Debian relay base image together. New Node/npm releases wait three days.

            Automatic merge requires this PR to pass the complete Validation
            workflow and contain only the permitted runtime version changes.
            If CI is awaiting approval, select Approve workflows to run in this PR.
            Configure RUNTIME_WORKFLOW_TOKEN for unattended workflow approval.

            The main validation and relay image publication run after merging.
            Cloudflare rollout follows the existing reviewed release process.
          add-paths: |
            .node-version
            package.json
            package-lock.json
            deploy/relay/node-image.txt
      - name: Start the actual PR validation and its merge continuation
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_WORKFLOW_TOKEN: ${{ secrets.RUNTIME_WORKFLOW_TOKEN }}
          RUNTIME_PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          RUNTIME_PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: node scripts/runtime-validation.mjs
