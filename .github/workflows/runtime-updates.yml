name: Runtime updates

on:
  schedule:
    # Monday 06:45 JST, after the grouped dependency check.
    - cron: '45 21 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-updates.yml
      - scripts/runtime-updates.mjs

permissions:
  contents: read

concurrency:
  group: agent-table-runtime-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'kitamura-tetsuo/agent-table' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Resolve compatible Node, npm, and Docker image updates together
        run: node scripts/runtime-updates.mjs --update
      - name: Validate the proposed runtime pins
        run: node scripts/runtime-updates.mjs --check
      - name: Create or refresh one runtime update PR
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: automation/runtime-updates
          base: main
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore(runtime): update Node, npm, and relay base image"
          title: "chore(runtime): update Node, npm, and relay base image"
          body: |
            Updates the supported Node and npm release lines and the digest-pinned
            Debian relay base image together. New Node/npm releases wait three days.

            Validation is explicitly dispatched for this branch. Automatic merge
            requires the current head to pass the complete Validation workflow and
            contain only the permitted runtime version changes.

            The main validation and relay image publication run after merging.
            Cloudflare rollout follows the existing reviewed release process.
          add-paths: |
            .node-version
            package.json
            package-lock.json
            deploy/relay/node-image.txt
      - name: Dispatch validation without waiting for bot-PR workflow approval
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/automation/runtime-updates" --jq .object.sha)"
          [[ "$current_sha" == "$PR_HEAD_SHA" ]]
          gh workflow run ci.yml --repo "$GH_REPO" --ref automation/runtime-updates
