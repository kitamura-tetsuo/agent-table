name: Protected release read credential verification

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected Environment containing the read-only Cloudflare token
        required: true
        type: choice
        options: [staging, production]
      expected_sha:
        description: Exact protected main commit SHA (40 lowercase hex digits)
        required: true
        type: string

# This workflow never publishes, modifies Cloudflare resources, or writes to GitHub.
permissions: {}

jobs:
  verify-release-credentials:
    if: >-
      github.repository == 'kitamura-tetsuo/agent-table' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
    environment:
      name: ${{ inputs.target_environment }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify immutable protected main SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify release-provider read access without exposing credentials
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-release-credentials.mjs
