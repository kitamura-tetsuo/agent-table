name: Validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check runtime pins
        run: node scripts/runtime-updates.mjs --check-runtime
      - name: Use the pinned npm release
        run: npm install --global --ignore-scripts "npm@$(node scripts/runtime-updates.mjs --print npm)"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate release scripts
        run: npx biome check scripts/manage-ingress-waf.mjs scripts/manage-ingress-waf.test.mjs scripts/wrangler-sqlite.test.mjs scripts/release-preflight.mjs scripts/release-preflight.test.mjs scripts/require-release-approval.mjs scripts/require-release-approval.test.mjs scripts/release-authorization.mjs scripts/release-authorization.test.mjs scripts/release-provider.mjs scripts/release-provider.test.mjs scripts/release-postverify.mjs scripts/release-postverify.test.mjs scripts/verify-release-credentials.mjs scripts/verify-release-credentials.test.mjs scripts/inbox-streams-workerd.test.mjs scripts/two-worker-subscriptions.mjs scripts/restore-transition-workerd.test.mjs
      - name: Lint normal-pause readback
        run: npx biome check scripts/release-pause-readback.mjs scripts/release-pause-readback.test.mjs
      - name: Lint historical snapshot rehearsal
        run: npx biome check scripts/restore-snapshot-workerd.test.mjs
      - name: Lint fresh-start recovery tools
        run: npx biome check scripts/recovery-*.mjs scripts/release-recovery.test.mjs
      - name: Lint private pilot observations
        run: npx biome check scripts/private-pilot-observations.mjs scripts/private-pilot-observations.test.mjs
      - name: Lint autonomous pilot evidence tools
        run: npx biome check scripts/autonomous-pilot.mjs scripts/autonomous-pilot.test.mjs
      - name: Lint foreground relay launcher
        run: npx biome check scripts/relay-launcher.mjs scripts/relay-launcher.test.mjs scripts/relay-controller.mjs scripts/relay-control.mjs scripts/relay-controller.test.mjs scripts/egress-relay-application.mjs scripts/egress-relay-http.mjs scripts/release-relay-decision.mjs scripts/production-relay-release.test.mjs scripts/relay-readiness-diagnostics.mjs scripts/relay-readiness-diagnostics.test.mjs
      - name: Lint dependency and runtime automation
        run: npx biome check scripts/runtime-updates.mjs scripts/runtime-updates.test.mjs scripts/dependency-automerge.mjs scripts/dependency-automerge.test.mjs
      - run: node --test scripts/*.test.mjs
      - name: Isolated Docker relay restart
        id: restart78_fixture
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          test -x /usr/bin/docker
          test -x /usr/bin/flock
          command -v openssl >/dev/null
          docker version --format '{{.Server.Version}}'
          NODE_RELAY_BASE="$(node scripts/runtime-updates.mjs --print image)"
          timeout 75s docker pull "$NODE_RELAY_BASE"
          timeout 75s docker build --network=none --pull=false \
            --build-arg "NODE_IMAGE=$NODE_RELAY_BASE" \
            -f deploy/relay/Dockerfile -t agent-table-restart78-ci .
          image_id="$(docker image inspect --format '{{.Id}}' agent-table-restart78-ci)"
          journal_dir="$RUNNER_TEMP/restart78-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -m 700 -- "$journal_dir"
          echo "starting=true" >> "$GITHUB_OUTPUT"
          AGENT_TABLE_RESTART78_MANIFEST="$journal_dir/manifest.json" \
            timeout --kill-after=40s 120s node scripts/relay-steady-docker-fixture.mjs "$image_id"
      - name: Verify and finish isolated relay fixture cleanup
        if: always()
        timeout-minutes: 1
        env:
          RESTART78_PRIMARY: ${{ steps.restart78_fixture.outcome }}
          RESTART78_STARTED: ${{ steps.restart78_fixture.outputs.starting }}
        run: |
          set -euo pipefail
          journal_dir="$RUNNER_TEMP/restart78-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          echo "Primary Docker fixture step: $RESTART78_PRIMARY"
          if [[ "$RESTART78_STARTED" != true && ! -e "$journal_dir" ]]; then
            echo "Fixture resources were not started"
            exit 0
          fi
          if [[ ! -f "$journal_dir/manifest.json" ]]; then
            echo "::error::Fixture cleanup unverified: expected journal missing"
            exit 1
          fi
          timeout 45s node scripts/relay-steady-docker-cleanup.mjs "$journal_dir/manifest.json"
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          check-latest: true
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m pytest -q test/unit/test_egress_experiments.py
      - name: Application unit tests
        run: npm test
      - name: Worker integration tests
        run: npm run test:integration
      - name: Relay operator real-producer recovery
        run: npm run test:relay-operator
      - name: Restore runtime tests
        run: npm run test:restore-runtime
      - run: npm run probe:subscriptions:sdk
      - run: npm run probe:subscriptions:table
      - run: npm run probe:subscriptions:two-worker
      - run: node scripts/verify-oauth-redemption-mutant.mjs
      - name: Wrangler dry-run
        run: npm run build
      - run: npx wrangler deploy --dry-run --config test/egress/wrangler.jsonc --outdir ../../dist/egress-probe
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E tests
        run: npm run test:e2e
