name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx biome check scripts/manage-ingress-waf.mjs scripts/manage-ingress-waf.test.mjs scripts/wrangler-sqlite.test.mjs scripts/release-preflight.mjs scripts/release-preflight.test.mjs scripts/require-release-approval.mjs scripts/require-release-approval.test.mjs scripts/inbox-streams-workerd.test.mjs scripts/two-worker-subscriptions.mjs
      - run: node --test scripts/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2 loguru==0.7.3
      - run: python -m pytest -q test/unit/test_egress_experiments.py
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:restore-runtime
      - run: npm run probe:subscriptions:sdk
      - run: npm run probe:subscriptions:table
      - run: npm run probe:subscriptions:two-worker
      - run: node scripts/verify-oauth-redemption-mutant.mjs
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config test/egress/wrangler.jsonc --outdir ../../dist/egress-probe
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
