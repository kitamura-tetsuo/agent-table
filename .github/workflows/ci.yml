name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Temporary diagnostic: snapshot Biome's canonical edits, then remove.
      - name: Temporary PR 37 formatter snapshot
        run: |
          npx biome check --write src schema test
          node --input-type=module -e '
            import fs from "node:fs";
            const paths = ["src/mcp/server.ts","src/objects/table.ts","src/services/tables.ts","src/shared/transcript.ts","test/integration/transcript.test.ts","schema/007_transcript.ts","schema/migrations.ts"];
            for (const path of paths) {
              const encoded = fs.readFileSync(path).toString("base64");
              for (let i = 0; i < encoded.length; i += 2400) {
                console.log("PR37_FORMAT|" + path + "|" + Math.floor(i / 2400) + "|" + encoded.slice(i, i + 2400));
              }
            }
          '
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: node scripts/verify-oauth-redemption-mutant.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
