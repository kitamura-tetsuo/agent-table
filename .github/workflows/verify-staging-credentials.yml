name: Staging credential read-only verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main commit SHA to verify
        required: true
        type: string

# No repository write permission or deployment capability is needed.
permissions: {}

jobs:
  verify-staging-credential:
    if: >-
      github.repository == 'kitamura-tetsuo/agent-table' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
      # Use protected environment secrets without recording a deployment.
      deployment: false
    steps:
      - name: Verify the exact main SHA and staging Worker read access
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            printf 'Expected SHA must match the exact protected main commit.\n' >&2
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_API_TOKEN" || ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            printf 'Required staging environment credential is missing or malformed.\n' >&2
            exit 1
          fi

          response_path="$(mktemp "$RUNNER_TEMP/staging-token-check.XXXXXXXX")"
          trap 'rm -f "$response_path"' EXIT

          # Read-only GET against one pinned staging Worker. Never print the
          # bearer token, response body, or any secret binding values.
          if ! http_status="$(
            curl --silent --show-error --proto '=https' --tlsv1.2 \
              --max-time 20 --connect-timeout 10 --request GET \
              --header 'Accept: application/json' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --output "$response_path" --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/agent-table-staging/script-settings"
          )"; then
            printf 'Cloudflare staging readback could not connect.\n' >&2
            exit 1
          fi

          if [[ "$http_status" != 200 ]]; then
            printf 'Cloudflare staging readback failed (HTTP %s).\n' "$http_status" >&2
            exit 1
          fi

          if ! jq -e '.success == true and (.result | type == "object")' "$response_path" >/dev/null 2>&1; then
            printf 'Cloudflare staging readback returned an invalid result.\n' >&2
            exit 1
          fi

          printf 'PASS: protected staging secret authenticated for read-only Worker settings.\n'
