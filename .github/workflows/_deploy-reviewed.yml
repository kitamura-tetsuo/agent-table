name: Reviewed deployment (reusable)

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      release_profile:
        required: false
        type: string
        default: manual
      bootstrap_staging:
        required: false
        type: boolean
        default: false
      expected_active_version_id:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: >-
      github.repository == 'kitamura-tetsuo/agent-table' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
    environment:
      name: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate immutable requested source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          BOOTSTRAP_STAGING: ${{ inputs.bootstrap_staging }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$CHECKED_OUT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$CHECKED_OUT_SHA" ]]
          if [[ "$RELEASE_PROFILE" != "manual" ]]; then
            [[ "$RELEASE_PROFILE" == "private-pilot-a-only" ]]
            [[ "$TARGET_ENVIRONMENT" == "staging" ]]
            [[ "$BOOTSTRAP_STAGING" == "false" ]]
          fi
      - run: npm ci
      - name: Recheck application and isolated Workerd gates
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
          npm run test:integration
          npm run test:restore-runtime
          npm run build
      - name: Validate candidate without access to deployment credentials
        id: candidate
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          RELEASE_CONFIG_JSON: ${{ secrets.RELEASE_CONFIG_JSON }}
          PEER_CONFIG_JSON: ${{ secrets.PEER_CONFIG_JSON }}
          RELEASE_SECRET_INVENTORY_JSON: ${{ secrets.RELEASE_SECRET_INVENTORY_JSON }}
          RELEASE_EVIDENCE_JSON: ${{ secrets.RELEASE_EVIDENCE_JSON }}
          RELEASE_OPERATIONS_JSON: ${{ secrets.RELEASE_OPERATIONS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_CONFIG_JSON"
          test -n "$PEER_CONFIG_JSON"
          test -n "$RELEASE_SECRET_INVENTORY_JSON"
          test -n "$RELEASE_EVIDENCE_JSON"
          test -n "$RELEASE_OPERATIONS_JSON"
          scratch="$RUNNER_TEMP/agent-table-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$scratch"
          config="$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          test ! -e "$config"
          printf '%s' "$RELEASE_CONFIG_JSON" > "$config"
          printf '%s' "$PEER_CONFIG_JSON" > "$scratch/peer.json"
          printf '%s' "$RELEASE_SECRET_INVENTORY_JSON" > "$scratch/secrets.json"
          printf '%s' "$RELEASE_EVIDENCE_JSON" > "$scratch/evidence.json"
          printf '%s' "$RELEASE_OPERATIONS_JSON" > "$scratch/operations.json"
          config_sha="$(sha256sum "$config" | cut -d " " -f1)"
          node scripts/release-preflight.mjs \
            --environment "$TARGET_ENVIRONMENT" --profile "$RELEASE_PROFILE" \
            --build-sha "$GITHUB_SHA" \
            --config "$config" --peer-config "$scratch/peer.json" \
            --secret-inventory "$scratch/secrets.json" \
            --evidence "$scratch/evidence.json" > "$scratch/preflight.txt"
          npx wrangler deploy --dry-run --config "$config" --outdir "$scratch/dry-run"
          printf 'config_sha=%s\n' "$config_sha" >> "$GITHUB_OUTPUT"
      - name: Authenticate provider ownership and release evidence
        id: gate
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          EXPECTED_CONFIG_SHA: ${{ steps.candidate.outputs.config_sha }}
          BOOTSTRAP_STAGING: ${{ inputs.bootstrap_staging }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/agent-table-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config="$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          test -n "$CLOUDFLARE_READ_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$EXPECTED_CONFIG_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(sha256sum "$config" | cut -d " " -f1)" == "$EXPECTED_CONFIG_SHA" ]]
          # The only producer of an approved manifest performs live authenticated
          # Cloudflare + exact-main CI reads inside the approved Environment.
          node scripts/release-authorization.mjs \
              --environment "$TARGET_ENVIRONMENT" --profile "$RELEASE_PROFILE" \
              --build-sha "$GITHUB_SHA" --config "$config" \
              --peer-config "$scratch/peer.json" \
              --secret-inventory "$scratch/secrets.json" \
              --evidence "$scratch/evidence.json" \
              --operations "$scratch/operations.json" \
              --bootstrap-staging "$BOOTSTRAP_STAGING" \
              --expected-active-version-id "$EXPECTED_ACTIVE_VERSION_ID" > "$scratch/approval.txt"
          node scripts/require-release-approval.mjs \
            "$TARGET_ENVIRONMENT" "$GITHUB_SHA" "$EXPECTED_CONFIG_SHA" "$RELEASE_PROFILE" \
            < "$scratch/approval.txt"
          printf 'approved=true\nconfig_sha=%s\n' "$EXPECTED_CONFIG_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish only the same independently approved config bytes
        if: steps.gate.outputs.approved == 'true'
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOTSTRAP_STAGING: ${{ inputs.bootstrap_staging }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          EXPECTED_CONFIG_SHA: ${{ steps.gate.outputs.config_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$EXPECTED_CONFIG_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(sha256sum "$config" | cut -d " " -f1)" == "$EXPECTED_CONFIG_SHA" ]]
          scratch="$RUNNER_TEMP/agent-table-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Recheck the private window immediately before the write, including
          # when an earlier step completed shortly before its expiry.
          node scripts/require-release-approval.mjs \
            "$TARGET_ENVIRONMENT" "$GITHUB_SHA" "$EXPECTED_CONFIG_SHA" "$RELEASE_PROFILE" \
            < "$scratch/approval.txt"
          # Recheck the latest main head immediately before any write.
          node --input-type=module -e '
            import { githubReader, verifyCurrentMainHead } from "./scripts/release-authorization.mjs";
            await verifyCurrentMainHead(process.env.GITHUB_SHA, githubReader(process.env.GITHUB_TOKEN));
          '
          if [[ "$BOOTSTRAP_STAGING" == "true" ]]; then
            scratch="$RUNNER_TEMP/agent-table-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            CONFIG_PATH="$config" PEER_PATH="$scratch/peer.json" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { cloudflareReader, readCloudflareDeployment } from "./scripts/release-provider.mjs";
              try {
                const config = JSON.parse(readFileSync(process.env.CONFIG_PATH, "utf8"));
                const peer = JSON.parse(readFileSync(process.env.PEER_PATH, "utf8"));
                const live = await readCloudflareDeployment(
                  config, peer, cloudflareReader(process.env.CLOUDFLARE_READ_TOKEN),
                  { bootstrapStaging: true },
                );
                if (live.targetState.versionId !== process.env.EXPECTED_ACTIVE_VERSION_ID) {
                  throw Error("active-version-changed");
                }
                process.stdout.write("STAGING_BOOTSTRAP_PREWRITE_VALID\n");
              } catch {
                process.stderr.write("STAGING_BOOTSTRAP_PREWRITE_BLOCKED\n");
                process.exitCode = 1;
              }
            '
          fi
          npx wrangler deploy --config "$config"
      - name: Read back exact deployed Worker, namespaces, route, and build
        if: steps.gate.outputs.approved == 'true'
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/agent-table-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config="$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          node scripts/release-postverify.mjs \
            --config "$config" --peer-config "$scratch/peer.json" \
            --approval "$scratch/approval.txt"
      - name: Remove ephemeral candidate after every outcome
        if: always()
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -rf "$RUNNER_TEMP/agent-table-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
