name: Reviewed manual deployment (reusable)

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.repository == 'kitamura-tetsuo/agent-table' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
    environment:
      name: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate immutable requested source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$CHECKED_OUT_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$CHECKED_OUT_SHA" ]]
      - run: npm ci
      - name: Recheck application and isolated Workerd gates
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
          npm run test:integration
          npm run test:restore-runtime
          npm run build
      - name: Validate candidate without access to deployment credentials
        id: gate
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RELEASE_CONFIG_JSON: ${{ secrets.RELEASE_CONFIG_JSON }}
          PEER_CONFIG_JSON: ${{ secrets.PEER_CONFIG_JSON }}
          RELEASE_SECRET_INVENTORY_JSON: ${{ secrets.RELEASE_SECRET_INVENTORY_JSON }}
          RELEASE_EVIDENCE_JSON: ${{ secrets.RELEASE_EVIDENCE_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_CONFIG_JSON"
          test -n "$PEER_CONFIG_JSON"
          test -n "$RELEASE_SECRET_INVENTORY_JSON"
          test -n "$RELEASE_EVIDENCE_JSON"
          scratch="$(mktemp -d "$RUNNER_TEMP/agent-table-release.XXXXXXXX")"
          config="$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}.json"
          test ! -e "$config"
          validated=false
          cleanup() {
            rm -rf "$scratch"
            if [[ "$validated" != true ]]; then rm -f "$config"; fi
          }
          trap cleanup EXIT
          printf '%s' "$RELEASE_CONFIG_JSON" > "$config"
          printf '%s' "$PEER_CONFIG_JSON" > "$scratch/peer.json"
          printf '%s' "$RELEASE_SECRET_INVENTORY_JSON" > "$scratch/secrets.json"
          printf '%s' "$RELEASE_EVIDENCE_JSON" > "$scratch/evidence.json"
          config_sha="$(sha256sum "$config" | cut -d " " -f1)"
          manifest="$(
            node scripts/release-preflight.mjs \
              --environment "$TARGET_ENVIRONMENT" --profile manual \
              --build-sha "$GITHUB_SHA" \
              --config "$config" --peer-config "$scratch/peer.json" \
              --secret-inventory "$scratch/secrets.json" \
              --evidence "$scratch/evidence.json"
          )"
          npx wrangler deploy --dry-run --config "$config" --outdir "$scratch/dry-run"
          # No publish credentials are supplied to this step. The validator
          # returns deploymentApproved:false until independent proof exists.
          printf '%s\n' "$manifest" | node scripts/require-release-approval.mjs \
            "$TARGET_ENVIRONMENT" "$GITHUB_SHA" "$config_sha"
          validated=true
          printf 'approved=true\nconfig_sha=%s\n' "$config_sha" >> "$GITHUB_OUTPUT"
      - name: Publish only the same independently approved config bytes
        if: steps.gate.outputs.approved == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CONFIG_SHA: ${{ steps.gate.outputs.config_sha }}
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}.json"
          trap 'rm -f "$config"' EXIT
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$EXPECTED_CONFIG_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(sha256sum "$config" | cut -d " " -f1)" == "$EXPECTED_CONFIG_SHA" ]]
          npx wrangler deploy --config "$config"
      - name: Remove ephemeral candidate after every outcome
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.release-candidate-${GITHUB_RUN_ID}.json"
