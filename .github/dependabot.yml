version: 2

# Keep application, test, and CI dependency upgrades in one weekly PR.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
    # Node types must follow the supported runtime major.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
